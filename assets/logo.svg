<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Đoán Nhạc</title>
  <!-- Hard bottom edge, then the purple block -->
  <rect x="4" y="8" width="56" height="54" rx="15" fill="#5B21B6"/>
  <rect x="4" y="2" width="56" height="54" rx="15" fill="#7C3AED"/>
  <!-- Sound waves -->
  <path d="M47 19 a14 14 0 0 1 0 22" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M17 19 a14 14 0 0 0 0 22" fill="none" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Question mark -->
  <path d="M24 20.5 a8 8 0 1 1 11.5 7.2 c-2.4 1.2 -3.5 2.8 -3.5 5.3 v0.8" fill="none" stroke="#FBBF24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The dot is a music note -->
  <ellipse cx="30.5" cy="46" rx="5" ry="4" transform="rotate(-20 30.5 46)" fill="#FBBF24"/>
  <path d="M35 45 V37.5 l5 2" fill="none" stroke="#FBBF24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
